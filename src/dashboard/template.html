<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIGIL-CHAIN Analyst Console</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#overview" aria-label="VIGIL-CHAIN overview">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M10.5 13 16 16.2l5.5-3.2M16 16.2v6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="10.5" cy="13" r="2.2" fill="currentColor"/><circle cx="21.5" cy="13" r="2.2" fill="currentColor"/><circle cx="16" cy="22.5" r="2.2" fill="currentColor"/>
      </svg>
      <span><b>VIGIL-CHAIN</b><small>Bitcoin traffic intelligence</small></span>
    </a>
    <div class="pills">
      <span class="pill ok" data-tip="&lt;b&gt;System running&lt;/b&gt;All five pipeline stages completed on this capture."><i aria-hidden="true"></i><span id="status-text">Live</span></span>
      <span class="pill" data-tip="&lt;b&gt;Air-gap ready&lt;/b&gt;The analysis makes no network call. It runs the same on a machine with no internet.">Works without internet</span>
      <span class="pill hide-sm">Synthetic demo data</span>
      <span class="pill hide-sm">SIH 2026 &middot; PS 26146</span>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Console sections">
    <a class="tab" role="tab" href="#overview" data-panel="overview">Overview</a>
    <a class="tab" role="tab" href="#cases" data-panel="cases">Cases <span class="count" id="case-count"></span></a>
    <a class="tab" role="tab" href="#origins" data-panel="origins">Network origins</a>
    <a class="tab" role="tab" href="#evaluation" data-panel="evaluation">Model evaluation</a>
    <a class="tab" role="tab" href="#method" data-panel="method">How it works</a>
  </nav>
</header>

<main class="wrap">
  <section class="panel" id="panel-overview"></section>
  <section class="panel" id="panel-cases">
    <div class="split">
      <aside class="rail">
        <div class="filters">
          <input id="q" type="search" placeholder="Search case, IP, TXID or address" aria-label="Search cases">
          <div class="chips" id="sev-filter" role="group" aria-label="Filter by severity"></div>
        </div>
        <div class="case-list" id="case-list"></div>
      </aside>
      <div id="case-detail"></div>
    </div>
  </section>
  <section class="panel" id="panel-origins"></section>
  <section class="panel" id="panel-evaluation"></section>
  <section class="panel" id="panel-method"></section>
  <footer class="foot" id="foot"></footer>
</main>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script id="vigil-data" type="application/json">__VIGIL_DATA__</script>
<script>
/*__JS__*/
</script>
</body>
</html>

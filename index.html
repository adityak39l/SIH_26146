<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIGIL-CHAIN Analyst Console</title>
<style>
:root {
  color-scheme: light;
  --page: #f1f4f9; --surface: #ffffff; --inset: #f3f6fb; --ink: #0c1222; --ink2: #4a5468; --muted: #8790a3;
  --grid: #e3e7ef; --axis: #c5ccd9; --border: rgba(12,18,34,0.10); --wash: rgba(12,18,34,0.045);
  --shadow: 0 1px 2px rgba(12,18,34,0.05), 0 10px 28px -14px rgba(12,18,34,0.18);
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-wash: rgba(42,120,214,0.10);
  --brand-1: #0d1b3d; --brand-2: #1c3f8f; --brand-3: #4a3aa7;
  --series-1: #2a78d6; --series-2: #eb6834; --context: #c5ccd9;
  --raise: #e34948; --lower: #2a78d6;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #090d18; --surface: #131a2b; --inset: #1a2236; --ink: #ffffff; --ink2: #b9c2d6; --muted: #7f8aa3;
    --grid: #232c42; --axis: #33405c; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.8);
    --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,0.18);
    --brand-1: #0a1430; --brand-2: #15327a; --brand-3: #3b2f8f;
    --series-1: #3987e5; --series-2: #d95926; --context: #3b4763; --raise: #e66767; --lower: #3987e5; --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #090d18; --surface: #131a2b; --inset: #1a2236; --ink: #ffffff; --ink2: #b9c2d6; --muted: #7f8aa3;
  --grid: #232c42; --axis: #33405c; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.8);
  --accent: #3987e5; --accent-ink: #9ec5f4; --accent-wash: rgba(57,135,229,0.18);
  --brand-1: #0a1430; --brand-2: #15327a; --brand-3: #3b2f8f;
  --series-1: #3987e5; --series-2: #d95926; --context: #3b4763; --raise: #e66767; --lower: #3987e5; --good-ink: #0ca30c;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 20px; }
main.wrap { padding-top: 22px; padding-bottom: 40px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } .hide-sm, .brand small { display: none !important; } }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 5; color: #fff;
  background: linear-gradient(100deg, var(--brand-1), var(--brand-2) 68%, var(--brand-3)); box-shadow: 0 8px 22px -14px rgba(9,13,24,0.7); }
.topbar :focus-visible { outline-color: #fff; }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; }
.brand svg { color: #8fc1ff; flex: none; }
.brand b { display: block; font-size: 16px; letter-spacing: 0.04em; line-height: 1.2; white-space: nowrap; }
.brand small { display: block; color: rgba(255,255,255,0.72); font-size: 12px; line-height: 1.2; }
.pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.10); white-space: nowrap; }
.pill.ok { border-color: rgba(74,222,128,0.55); background: rgba(74,222,128,0.16); color: #fff; font-weight: 600; }
.pill.ok i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.7); } 100% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } }
@media (prefers-reduced-motion: reduce) { .pill.ok i { animation: none; box-shadow: 0 0 0 3px rgba(74,222,128,0.25); } }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.10); color: #fff; }
.icon-btn:hover { background: rgba(255,255,255,0.22); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 12px; border-bottom: 3px solid transparent; color: rgba(255,255,255,0.72); white-space: nowrap; font-weight: 500; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { color: #fff; border-bottom-color: #8fc1ff; font-weight: 600; }
.tab .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px;
  background: rgba(255,255,255,0.16); font-size: 11.5px; text-align: center; color: #fff; }
.panel { display: none; } .panel.active { display: block; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
.card + .card, .stack > * + * { margin-top: 16px; }
.grid > .card { margin-top: 0; }
.card h2 { font-size: 15px; margin: 0; letter-spacing: -0.005em; }
.card h3 { font-size: 12px; margin: 18px 0 8px; color: var(--ink2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.desc { color: var(--ink2); font-size: 12.5px; margin: 3px 0 14px; max-width: 78ch; }
.small { font-size: 12.5px; color: var(--ink2); }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); }
@media (max-width: 900px) { .g-side { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 400px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--ink2); }
button.chip:hover { background: var(--wash); }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tag { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; background: var(--accent-wash); color: var(--accent-ink); font-weight: 500; }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; }
.sev i { font-style: normal; font-size: 11px; line-height: 1; }
.sev.CRITICAL i { color: var(--critical); } .sev.HIGH i { color: var(--serious); }
.sev.MEDIUM i { color: var(--warning); } .sev.LOW i { color: var(--muted); }
.copy { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 12px; }
.copy:hover { color: var(--accent-ink); }
.hash { word-break: break-all; color: var(--ink2); }

/* ---------- overview ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.card.hero { color: #fff; border-color: transparent; padding: 28px;
  background: radial-gradient(820px 320px at 88% -30%, rgba(143,193,255,0.38), transparent 62%),
              linear-gradient(118deg, var(--brand-1), var(--brand-2) 58%, var(--brand-3));
  --critical: #ff9a9a; --serious: #ffb98f; --warning: #ffd666; }
.hero .eyebrow { color: rgba(255,255,255,0.72); }
.hero .ran { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; font-size: 12.5px; color: rgba(255,255,255,0.84); }
.hero .ran i { width: 16px; height: 16px; border-radius: 50%; background: #4ade80; color: #0d1b3d; display: inline-grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
.hero .btn { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.24); color: #fff; }
.hero .btn:hover { background: rgba(255,255,255,0.24); }
.hero .btn.primary, .hero .btn.primary:hover { background: #fff; color: #0d1b3d; filter: none; }
.hero h1 { font-size: 27px; line-height: 1.2; letter-spacing: -0.02em; margin: 6px 0 8px; font-weight: 650; }
.hero p { margin: 0 0 16px; color: rgba(255,255,255,0.84); max-width: 64ch; }
.sev-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sev-tile { border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 14px; background: rgba(255,255,255,0.10); color: #fff; text-align: left; }
button.sev-tile:hover { background: rgba(255,255,255,0.2); }
.sev-tile .small { color: rgba(255,255,255,0.74); }
.sev-tile b { display: block; font-size: 28px; line-height: 1.15; font-weight: 650; }
.funnel { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-top: 16px; counter-reset: stage; }
.funnel .step { position: relative; padding: 14px 16px 14px 22px; background: var(--surface); border: 1px solid var(--border); border-left-width: 0; }
.funnel .step:first-child { border-left-width: 1px; border-radius: 12px 0 0 12px; padding-left: 16px; }
.funnel .step:last-child { border-radius: 0 12px 12px 0; }
.funnel .step:not(:last-child)::after { content: ""; position: absolute; right: -7px; top: 50%; width: 12px; height: 12px; z-index: 1;
  background: var(--surface); border-top: 1px solid var(--border); border-right: 1px solid var(--border); transform: translateY(-50%) rotate(45deg); }
.funnel .k { font-size: 11.5px; color: var(--accent-ink); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.funnel .k::before { counter-increment: stage; content: counter(stage); display: inline-grid; place-items: center; width: 18px; height: 18px;
  margin-right: 7px; border-radius: 50%; color: #fff; font-size: 11px; letter-spacing: 0;
  background: linear-gradient(135deg, var(--accent), var(--brand-3)); }
.funnel .step:last-child { background: linear-gradient(0deg, var(--accent-wash), var(--accent-wash)), var(--surface); }
.funnel .v { font-size: 24px; font-weight: 650; line-height: 1.25; }
.funnel .h { font-size: 12px; color: var(--muted); }
@media (max-width: 1000px) {
  .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .funnel .step, .funnel .step:first-child, .funnel .step:last-child { border-left-width: 1px; border-radius: 12px; padding-left: 16px; }
  .funnel .step::after { display: none; }
}
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink2); margin: 0 0 10px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.cols { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid var(--axis);
  background: linear-gradient(var(--grid), var(--grid)) 0 0 / 100% 1px no-repeat, linear-gradient(var(--grid), var(--grid)) 0 50% / 100% 1px no-repeat; }
.cols .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
.cols .col:hover { background: var(--wash); }
.cols .seg.flag { background: var(--series-1); }
.cols .seg.rest { background: var(--context); }
.cols .seg:last-child { border-radius: 3px 3px 0 0; }
.axis-x { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.axis-y { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 34%) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
.hbar .t { position: relative; height: 12px; border-left: 1px solid var(--axis); }
.hbar .t div { position: absolute; left: 0; top: 0; height: 12px; border-radius: 0 4px 4px 0; background: var(--c, var(--series-1)); }
.hbar .t div.ctx { background: var(--context); }
.hbar .n { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12.5px; white-space: nowrap; }
.row-link { cursor: pointer; } .row-link:hover td { background: var(--wash); }

/* ---------- tables ---------- */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 7px 10px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.databar { display: grid; grid-template-columns: minmax(70px, 1fr) 44px; gap: 8px; align-items: center; min-width: 140px; }
.databar .t { height: 10px; position: relative; border-left: 1px solid var(--axis); }
.databar .t div { position: absolute; left: 0; top: 0; height: 10px; border-radius: 0 4px 4px 0; background: var(--c); }
.databar span { text-align: right; font-variant-numeric: tabular-nums; }
tr.best td { background: var(--accent-wash); font-weight: 600; }

/* ---------- cases ---------- */
.split { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 18px; align-items: start; }
.rail { position: sticky; top: 104px; }
@media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } }
.filters { display: grid; gap: 8px; margin-bottom: 10px; }
.filters input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 8px 11px; }
.filters input::placeholder { color: var(--muted); }
.case-list { display: grid; gap: 8px; max-height: calc(100vh - 230px); overflow-y: auto; padding: 2px; margin: -2px; }
@media (max-width: 960px) { .case-list { max-height: 330px; } }
.case-item { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 11px 12px 10px; width: 100%; display: block; }
.case-item:hover { background: var(--wash); }
.case-item[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-wash); }
.case-item .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.case-item .id { font-weight: 650; }
.case-item .score { font-weight: 650; font-size: 16px; font-variant-numeric: tabular-nums; }
.case-item .meta { color: var(--ink2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 4px; border-radius: 2px; background: var(--grid); margin: 7px 0 6px; overflow: hidden; }
.meter div { height: 100%; border-radius: 2px; background: var(--c); }
.empty { border: 1px dashed var(--axis); border-radius: 11px; padding: 18px; color: var(--ink2); text-align: center; }
.case-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
@media (max-width: 640px) { .case-head { grid-template-columns: auto minmax(0, 1fr); } .case-head .actions { grid-column: 1 / -1; } }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .bg { fill: none; stroke: var(--grid); }
.ring .fg { fill: none; stroke: var(--c); stroke-linecap: round; }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .val b { font-size: 22px; font-weight: 650; display: block; }
.ring .val span { font-size: 10.5px; color: var(--ink2); }
.case-head h2 { font-size: 19px; letter-spacing: -0.01em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.summary { overflow-wrap: anywhere; margin: 16px 0 0; padding: 12px 14px; background: var(--inset); border-radius: 10px; border-left: 3px solid var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 18px; margin-top: 16px; }
.kv div span { display: block; color: var(--ink2); font-size: 12px; }
.kv div b { font-weight: 600; font-variant-numeric: tabular-nums; }
.factor { display: grid; grid-template-columns: minmax(150px, 40%) minmax(0, 1fr) 56px; gap: 10px; align-items: center; padding: 5px 6px; margin: 0 -6px; font-size: 13px; border-radius: 6px; }
.factor:hover { background: var(--wash); }
.factor .track { position: relative; height: 14px; }
.factor .zero { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }
.factor .bar { position: absolute; top: 0; height: 14px; }
.factor .bar.raise { background: var(--raise); border-radius: 0 4px 4px 0; }
.factor .bar.lower { background: var(--lower); border-radius: 4px 0 0 4px; }
.factor .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
@media (max-width: 640px) { .factor { grid-template-columns: minmax(0, 1fr) 52px; } .factor .track { grid-column: 1 / -1; grid-row: 2; } }
.equation { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); font-size: 12.5px; color: var(--ink2); }
.equation b { color: var(--ink); font-variant-numeric: tabular-nums; }
.flow { overflow: auto; border: 1px solid var(--grid); border-radius: 10px; max-height: 470px; background: var(--inset); }
.flow svg { display: block; }
.flow .edge { fill: none; stroke: var(--axis); }
.flow .edge:hover { stroke: var(--ink2); }
.flow .node rect.body { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
.flow .node text { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.flow .node text.id { fill: var(--ink2); font-family: ui-monospace, Consolas, monospace; font-size: 10px; font-weight: 400; }
.flow .node { cursor: pointer; }
.flow .node:hover rect.body { stroke: var(--ink2); }
.flow .node.selected rect.body { stroke: var(--accent); stroke-width: 2; }
.flow .node.bridge rect.body { stroke-dasharray: 3 3; }
#tx-detail:not(:empty) { margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--inset); }
details > summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
details[open] > summary::before { content: "▾"; }
details[open] > summary { margin-bottom: 12px; }

/* ---------- evaluation & method ---------- */
.stat { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; padding: 17px 16px 14px; background: var(--surface); box-shadow: var(--shadow); }
.stat::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--brand-3)); }
.stat .k { font-size: 12px; color: var(--ink2); }
.stat .v { font-size: 30px; font-weight: 650; line-height: 1.2; letter-spacing: -0.01em; }
.stat .h { font-size: 12.5px; color: var(--ink2); }
.stat .up { color: var(--good-ink); font-weight: 600; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
@media (max-width: 1100px) { .steps { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); } }
.step-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.step-card .ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--brand-3)); color: #fff; margin-bottom: 10px; }
.step-card .no { position: absolute; top: 14px; right: 16px; font-size: 12px; font-weight: 600; color: var(--muted); }
.step-card h2 { font-size: 15px; margin: 0 0 4px; }
.step-card p { margin: 0; color: var(--ink2); font-size: 12.5px; }
.callout { border-left: 3px solid var(--warning); background: var(--inset); border-radius: 10px; padding: 12px 14px; }
.foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* ---------- live demo ---------- */
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; margin-right: 6px; vertical-align: 1px; }
.live-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
@media (max-width: 760px) { .live-head { grid-template-columns: minmax(0, 1fr); } }
.live-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn.big { padding: 10px 18px; font-size: 15px; font-weight: 600; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--brand-3)); box-shadow: 0 8px 20px -10px var(--accent); }
.live-bar { height: 5px; border-radius: 3px; background: var(--grid); margin: 14px 0; overflow: hidden; }
.live-bar div { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--brand-3)); transition: width 0.1s linear; }
.live-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1000px) { .live-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .live-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.lstat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.lstat span { display: block; font-size: 12px; color: var(--ink2); }
.lstat b { font-size: 24px; font-weight: 650; line-height: 1.25; font-variant-numeric: tabular-nums; }
.lstat b.mono { font-size: 20px; }
.lstat.alert { border-color: var(--critical); }
.feed { height: 380px; overflow-y: auto; border: 1px solid var(--grid); border-radius: 10px; }
.feed .empty, .alerts .empty { border: 0; margin: 40px 16px; }
.feed-row { display: grid; grid-template-columns: 64px 108px minmax(0, 1fr) 96px 86px 44px; gap: 8px; align-items: center;
  padding: 6px 10px; border-bottom: 1px solid var(--grid); font-size: 12.5px; animation: slide 0.25s ease-out; }
.feed-row .net { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-row .n { text-align: right; font-variant-numeric: tabular-nums; }
.feed-row.hot { background: var(--accent-wash); }
@media (max-width: 640px) { .feed-row { grid-template-columns: 58px minmax(0, 1fr) 80px 40px; } .feed-row > :nth-child(2), .feed-row .n:nth-child(4) { display: none; } }
@keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.alerts { height: 380px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
.alert-card { display: grid; gap: 4px; border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.alert-card:hover { background: var(--wash); }
.alert-card.fresh { animation: flash 0.9s ease-out; }
.alert-card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
@keyframes flash { from { background: var(--accent-wash); transform: scale(1.015); } to { background: var(--surface); transform: none; } }
@media (prefers-reduced-motion: reduce) { .feed-row, .alert-card.fresh { animation: none; } }
.sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .sim-grid { grid-template-columns: minmax(0, 1fr); } }
.sim-controls { display: grid; gap: 14px; }
.ctl { display: grid; gap: 6px; font-size: 13px; }
.ctl > span { color: var(--ink2); } .ctl > span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.sim-out { background: var(--inset); border-radius: 12px; padding: 16px; }
.sim-score { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }

/* ---------- overlays ---------- */
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 11px; font-size: 12.5px; box-shadow: 0 6px 22px rgba(0,0,0,0.2); max-width: 320px; display: none; }
#tip b { display: block; margin-bottom: 2px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--page);
  padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 30; }
#toast.show { opacity: 1; }

@media print {
  .topbar, .rail, .actions, .foot, #tip, #toast { display: none !important; }

  .flow { max-height: none; overflow: visible; } body { background: #fff; } .card { box-shadow: none; break-inside: avoid; }
  details > summary::before { display: none; }
}

,"transactions":11,"best_case":"CASE-004","in_best_case":11,"coverage":1.0},{"scenario":"STRUCT-1","transactions":13,"best_case":"CASE-006","in_best_case":13,"coverage":1.0},{"scenario":"STRUCT-2","transactions":17,"best_case":"CASE-005","in_best_case":17,"coverage":1.0}]},"real_data":{"dataset":"Elliptic Bitcoin dataset (Weber et al., 2019)","transactions":203769,"edges":234355,"features":165,"labelled_illicit":4545,"labelled_licit":42019,"split":"fit on time steps 1-25, tune on 30-34, test on 35-49 (unseen graphs)","preprocessing":"standardised features clipped to +-3, chosen on the validation window","test_illicit":1083,"test_licit":15587,"architecture":"GraphSAGE mean, 2 layers, hidden 64, NumPy","detectors":{"logistic":{"label":"Logistic regression (features only)","precision":0.1987,"recall":0.8033,"f1":0.3186,"roc_auc":0.8727,"average_precision":0.2981,"tp":870,"fp":3509,"fn":213,"threshold":0.9749},"mlp":{"label":"Neural network without the graph","epochs":50,"precision":0.2582,"recall":0.4949,"f1":0.3393,"roc_auc":0.8298,"average_precision":0.1925,"tp":536,"fp":1540,"fn":547,"threshold":0.9235},"graphsage":{"label":"GraphSAGE (this project's GNN)","epochs":40,"precision":0.349,"recall":0.4395,"f1":0.389,"roc_auc":0.8751,"average_precision":0.2574,"tp":476,"fp":888,"fn":607,"threshold":0.8627},"isolation_forest":{"label":"Isolation Forest (unsupervised)","precision":0.0,"recall":0.0,"f1":0.0,"roc_auc":0.1688,"average_precision":0.0363,"tp":0,"fp":1083,"fn":1083,"threshold":0.5696}},"runtime_s":618.9,"reference":"Weber et al. (2019) report an illicit-class F1 of about 0.63 for a GCN and about 0.79 for a random forest on this split"}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("vigil-data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "—" : v).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (v, d = 0) => Number(v).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
const btc = (v) => num(v, 4) + " BTC";
const signed = (v, d = 2) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const iso = (ts) => new Date(ts * 1000).toISOString();
const when = (ts) => ts == null ? "—" : iso(ts).replace("T", " ").slice(0, 19) + " UTC";
const clock = (ts) => iso(ts).slice(11, 16);
const short = (s, n = 8) => s && s.length > 2 * n + 1 ? s.slice(0, n) + "…" + s.slice(-n) : s;
const GLYPH = {CRITICAL: "◆", HIGH: "▲", MEDIUM: "●", LOW: "○"};
const SEV_VAR = {CRITICAL: "var(--critical)", HIGH: "var(--serious)", MEDIUM: "var(--warning)", LOW: "var(--muted)"};
const sev = (level) => `<span class="sev ${esc(level)}"><i aria-hidden="true">${GLYPH[level] || "○"}</i>${esc(level)}</span>`;
const copyBtn = (text, label = "copy") => `<button class="copy" type="button" data-copy="${esc(text)}" aria-label="Copy ${esc(label)}">⧉</button>`;
const S = DATA.summary, CASES = DATA.cases;
const state = {selected: CASES.length ? CASES[0].case_id : null, q: "", sev: "ALL"};

/* ---------- tooltip, toast, copy (delegated) ---------- */
const tip = $("tip");
document.addEventListener("mousemove", (ev) => {
  const el = ev.target.closest && ev.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.innerHTML = el.dataset.tip;
  tip.style.display = "block";
  const pad = 14, r = tip.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
});
function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 1400);
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-copy]");
  if (!el) return;
  ev.stopPropagation();
  const text = el.dataset.copy;
  const done = () => toast("Copied");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast("Copy failed"));
  else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
});

/* ---------- theme ---------- */
(function theme() {
  const root = document.documentElement;
  let saved = new URLSearchParams(location.search).get("theme");
  try { saved = saved || localStorage.getItem("vigil-theme"); } catch (e) { /* storage unavailable */ }
  if (saved === "dark" || saved === "light") root.dataset.theme = saved;
  $("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("vigil-theme", root.dataset.theme); } catch (e) { /* storage unavailable */ }
  });
})();

/* ---------- shared chart pieces ---------- */
function hbar(label, value, max, right, tipHtml, overlay) {
  const w = max ? (value / max) * 100 : 0;
  const over = overlay ? `<div style="width:${max ? (overlay / max) * 100 : 0}%"></div>` : "";
  return `<div class="hbar" data-tip="${esc(tipHtml)}"><div>${esc(label)}</div>
    <div class="t"><div class="${overlay == null ? "" : "ctx"}" style="width:${w}%"></div>${over}</div><div class="n">${esc(right)}</div></div>`;
}
function ring(score, level) {
  const r = 38, c = 2 * Math.PI * r;
  return `<div class="ring" style="--c:${SEV_VAR[level]}"><svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">
    <circle class="bg" cx="44" cy="44" r="${r}" stroke-width="8"></circle>
    <circle class="fg" cx="44" cy="44" r="${r}" stroke-width="8" stroke-dasharray="${(score / 100) * c} ${c}"></circle></svg>
    <div class="val"><div><b>${num(score, 1)}</b><span>risk / 100</span></div></div></div>`;
}
function factorRows(factors) {
  const shown = factors.filter((f) => Math.abs(f.shap_log_odds) >= 0.05);
  if (!shown.length) return `<div class="small">No signal moved this score by more than 0.05 log-odds.</div>`;
  const lo = Math.min(0, ...shown.map((f) => f.shap_log_odds)), hi = Math.max(0, ...shown.map((f) => f.shap_log_odds));
  const span = (hi - lo) || 1, zero = (-lo / span) * 100;
  return shown.map((f) => {
    const w = Math.abs(f.shap_log_odds) / span * 100, raise = f.shap_log_odds >= 0;
    const tipHtml = `<b>${esc(f.factor)}</b>Signal value ${esc(f.value)}<br>Contribution ${signed(f.shap_log_odds)} log-odds` +
      (raise && f.share_pct !== "" ? `<br>${esc(f.share_pct)}% of the upward push` : "");
    return `<div class="factor" data-tip="${esc(tipHtml)}"><div>${esc(f.factor)}</div>
      <div class="track"><div class="bar ${raise ? "raise" : "lower"}" style="left:${raise ? zero : zero - w}%;width:${Math.max(w, 0.6)}%"></div><div class="zero" style="left:${zero}%"></div></div>
      <div class="num">${signed(f.shap_log_odds)}</div></div>`;
  }).join("");
}

/* ---------- overview ---------- */
(function renderOverview() {
  const o = DATA.overview, by = S.cases_by_severity;
  const inflow = CASES.reduce((sum, c) => sum + c.inflow_btc, 0);
  const resolved = S.transactions ? Math.round(100 * S.origin_attributed / S.transactions) : 0;
  const headline = CASES.length
    ? `${num(S.cases)} suspected laundering operation${S.cases === 1 ? "" : "s"} found in ${num(S.transactions)} transactions`
    : `No suspicious operation found in ${num(S.transactions)} transactions`;
  const steps = [
    ["Captured", num(S.observations), "network announcements"],
    ["Joined", num(S.transactions), "transactions by TXID"],
    ["Attributed", resolved + "%", "origin IP resolved"],
    ["Clustered", num(S.entities), "wallet entities"],
    ["Flagged", num(S.flagged_transactions), "transactions at risk ≥ " + DATA.model_card.thresholds.medium],
    ["Cases", num(S.cases), num(by.CRITICAL) + " critical"],
  ];
  const maxT = Math.max(1, ...o.timeline.map((b) => b.total));
  const cols = o.timeline.map((b) => {
    const tipHtml = `<b>${clock(b.t)} – ${clock(b.t + o.bucket_s)} UTC</b>${b.total} transaction${b.total === 1 ? "" : "s"}<br>${b.flagged} flagged`;
    const rest = b.total - b.flagged;
    return `<div class="col" data-tip="${esc(tipHtml)}">` +
      (b.flagged ? `<div class="seg flag" style="height:${(b.flagged / maxT) * 100}%"></div>` : "") +
      (rest ? `<div class="seg rest" style="height:${(rest / maxT) * 100}%"></div>` : "") + `</div>`;
  }).join("");
  const last = o.timeline.length ? o.timeline[o.timeline.length - 1].t + o.bucket_s : 0;
  const maxN = Math.max(1, ...o.networks.map((n) => n.total));
  const nets = o.networks.map((n) => hbar(n.label, n.total, maxN, `${n.flagged} of ${n.total}`,
    `<b>${esc(n.label)}</b>${n.total} transactions announced first from this network type<br>${n.flagged} flagged (${n.total ? Math.round(100 * n.flagged / n.total) : 0}%)`, n.flagged)).join("");
  const maxC = Math.max(1, ...o.typologies.map((t) => t.cases));
  const typs = o.typologies.map((t) => hbar(t.typology, t.cases, maxC, `${t.cases} case${t.cases === 1 ? "" : "s"}`,
    `<b>${esc(t.typology)}</b>${t.cases} case${t.cases === 1 ? "" : "s"}, ${t.transactions} transactions<br>${esc(btc(t.inflow_btc))} entering those cases`)).join("");
  const top = CASES.slice(0, 6).map((c) => {
    const origin = c.origins.find((x) => x.resolved);
    return `<tr class="row-link" data-go="#cases/${esc(c.case_id)}" tabindex="0"><td>${sev(c.severity)}</td><td><b>${esc(c.case_id)}</b></td><td>${esc(c.typology)}</td>
      <td class="n">${esc(c.tx_count)}</td><td class="n">${esc(btc(c.inflow_btc))}</td><td>${origin ? esc(origin.category_label) + " · " + esc(origin.country) : "unresolved"}</td><td class="n"><b>${num(c.risk_score, 1)}</b></td></tr>`;
  }).join("");

  $("panel-overview").innerHTML = `
    <div class="card hero">
      <div>
        <div class="eyebrow">Capture summary</div>
        <h1>${esc(headline)}</h1>
        <p>${esc(btc(inflow))} moved through the flagged operations. Each case joins what the network saw (who announced it, from where) with what the ledger recorded (which wallets, how much), and explains its score signal by signal.</p>
        <div class="actions"><a class="btn primary" href="#live" data-run="1">▶ Run live demo</a><a class="btn" href="#cases">Review cases →</a><a class="btn" href="#evaluation">How accurate is it?</a><a class="btn" href="#method">How it works</a></div>
        <div class="ran"><i aria-hidden="true">✓</i>Analysis complete: ${num(S.transactions)} transactions processed in ${esc(DATA.meta.runtime_s)} s, all 5 stages ran</div>
      </div>
      <div class="sev-tiles">
        ${["CRITICAL", "HIGH", "MEDIUM"].map((l) => `<button class="sev-tile" type="button" data-sev="${l}">${sev(l)}<b>${num(by[l])}</b><span class="small">case${by[l] === 1 ? "" : "s"}</span></button>`).join("")}
      </div>
    </div>
    <div class="funnel" aria-label="Pipeline stages">${steps.map(([k, v, h]) => `<div class="step"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="h">${esc(h)}</div></div>`).join("")}</div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2>Activity over the capture</h2><p class="desc">Transactions by first-seen time, in ${Math.round(o.bucket_s / 60)}-minute buckets.</p>
        <div class="legend"><span style="--c:var(--series-1)">flagged</span><span style="--c:var(--context)">not flagged</span></div>
        <div class="axis-y">${maxT} transactions</div><div class="cols">${cols}</div>
        <div class="axis-x"><span>${o.timeline.length ? clock(o.timeline[0].t) : ""}</span><span>${o.timeline.length ? iso(o.timeline[0].t).slice(0, 10) + " UTC" : ""}</span><span>${o.timeline.length ? clock(last) : ""}</span></div></div>
      <div class="card"><h2>Where flagged traffic was announced from</h2><p class="desc">Network type of the first-seen origin. The grey bar is every transaction from that network type; the blue part was flagged.</p>
        <div class="legend"><span style="--c:var(--series-1)">flagged</span><span style="--c:var(--context)">all transactions</span></div>${nets}</div>
    </div>
    <div class="grid g-side" style="margin-top:16px">
      <div class="card"><h2>Typologies found</h2><p class="desc">A case can show more than one pattern.</p>${typs || `<div class="small">None.</div>`}</div>
      <div class="card"><h2>Highest-risk cases</h2><p class="desc">Select a row to open the case.</p>
        <div class="scroll"><table><thead><tr><th>Severity</th><th>Case</th><th>Typology</th><th class="n">Tx</th><th class="n">Funds</th><th>Origin</th><th class="n">Risk</th></tr></thead><tbody>${top}</tbody></table></div></div>
    </div>`;
  $("panel-overview").querySelectorAll("[data-sev]").forEach((b) => b.addEventListener("click", () => { state.sev = b.dataset.sev; location.hash = "#cases"; renderCaseList(); }));
})();
document.addEventListener("click", (ev) => { const row = ev.target.closest("[data-go]"); if (row) location.hash = row.dataset.go; });
document.addEventListener("click", (ev) => { if (ev.target.closest("[data-run]")) setTimeout(() => { if (!live.playing) $("lv-play").click(); }, 150); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.go) location.hash = ev.target.dataset.go; });

/* ---------- cases: list ---------- */
function caseMatches(c) {
  if (state.sev !== "ALL" && c.severity !== state.sev) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [c.case_id, c.typology, ...c.origins.map((o) => o.ip + " " + o.asn + " " + o.category_label),
    ...c.transactions.map((t) => t.txid), ...c.terminal_outputs.map((t) => t.address)].join(" ").toLowerCase();
  return hay.includes(q);
}
function renderCaseList() {
  const counts = {ALL: CASES.length, CRITICAL: 0, HIGH: 0, MEDIUM: 0};
  CASES.forEach((c) => { counts[c.severity] = (counts[c.severity] || 0) + 1; });
  $("sev-filter").innerHTML = [["ALL", "All"], ["CRITICAL", "Critical"], ["HIGH", "High"], ["MEDIUM", "Medium"]]
    .map(([k, l]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${state.sev === k}">${l} ${counts[k]}</button>`).join("");
  $("sev-filter").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { state.sev = b.dataset.f; renderCaseList(); }));
  const shown = CASES.filter(caseMatches);
  $("case-list").innerHTML = shown.length ? shown.map((c) => `
    <button class="case-item" type="button" data-case="${esc(c.case_id)}" aria-current="${c.case_id === state.selected}">
      <div class="row"><span class="id">${esc(c.case_id)}</span><span class="score">${num(c.risk_score, 1)}</span></div>
      <div class="meter" style="--c:${SEV_VAR[c.severity]}"><div style="width:${c.risk_score}%"></div></div>
      <div class="row"><span>${sev(c.severity)}</span><span class="meta">${esc(btc(c.inflow_btc))}</span></div>
      <div class="meta">${esc(c.typology)} · ${esc(c.tx_count)} tx · ${esc(c.duration)}</div>
    </button>`).join("") : `<div class="empty">No case matches this filter.</div>`;
  $("case-list").querySelectorAll(".case-item").forEach((el) => el.addEventListener("click", () => { location.hash = "#cases/" + el.dataset.case; }));
}
$("q").addEventListener("input", (ev) => { state.q = ev.target.value; renderCaseList(); });
$("case-list").addEventListener("keydown", (ev) => {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  const items = [...$("case-list").querySelectorAll(".case-item")], i = items.indexOf(document.activeElement);
  const next = items[Math.min(items.length - 1, Math.max(0, i + (ev.key === "ArrowDown" ? 1 : -1)))];
  if (next) { ev.preventDefault(); next.focus(); location.hash = "#cases/" + next.dataset.case; }
});

/* ---------- cases: detail ---------- */
function flowSvg(c) {
  const txs = c.transactions, depth = txs.map(() => 0);
  c.edges.forEach(([a, b]) => { depth[b] = Math.max(depth[b], depth[a] + 1); });
  const rows = {}, pos = txs.map((_, i) => { const r = rows[depth[i]] = (rows[depth[i]] || 0) + 1; return [depth[i], r - 1]; });
  const NW = 96, NH = 42, GX = 38, GY = 14, PAD = 14;
  const x = (d) => PAD + d * (NW + GX), y = (r) => PAD + r * (NH + GY);
  const width = x(Math.max(...depth)) + NW + PAD, height = y(Math.max(...Object.values(rows)) - 1) + NH + PAD;
  const maxAmt = Math.max(...c.edges.map((e) => e[2]), 1e-8);
  const edges = c.edges.map(([a, b, amt]) => {
    const x1 = x(pos[a][0]) + NW, y1 = y(pos[a][1]) + NH / 2, x2 = x(pos[b][0]), y2 = y(pos[b][1]) + NH / 2, mx = (x1 + x2) / 2;
    return `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke-width="${(1.2 + 3 * Math.sqrt(amt / maxAmt)).toFixed(2)}" data-tip="${esc(`<b>${btc(amt)}</b>moved from ${short(txs[a].txid)} to ${short(txs[b].txid)}`)}"></path>`;
  }).join("");
  const nodes = txs.map((t, i) => {
    const tipHtml = `<b>${esc(short(t.txid, 10))}</b>${esc(when(t.timestamp))}<br>${esc(t.inputs)} in → ${esc(t.outputs)} out, ${esc(btc(t.value_btc))}` +
      `<br>Risk ${num(t.risk_score, 1)} (${esc(t.severity)})${t.bridge ? ", kept as a bridge" : ""}` +
      `<br>Origin ${esc(t.origin_ip)} (${esc(t.origin_country)}), confidence ${esc(t.origin_confidence)}`;
    return `<g class="node${t.bridge ? " bridge" : ""}" data-idx="${i}" transform="translate(${x(pos[i][0])},${y(pos[i][1])})" data-tip="${esc(tipHtml)}" tabindex="0" role="button" aria-label="Transaction ${esc(t.txid.slice(0, 10))}, risk ${num(t.risk_score, 1)}">
      <rect class="body" width="${NW}" height="${NH}" rx="7"></rect>

function txDetail(c, i) {
  const t = c.transactions[i];
  const factors = DATA.model_card.evidence.map((e, k) => ({factor: e.absent_label && t.evidence[k] < 0.5 ? e.absent_label : e.label,
    value: t.evidence[k], shap_log_odds: t.shap[k], share_pct: ""})).sort((a, b) => Math.abs(b.shap_log_odds) - Math.abs(a.shap_log_odds));
  return `<div class="row" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">

  const panel = document.getElementById("panel-" + name) ? name : "overview";
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.panel === panel)));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + panel));
  if (panel === "cases") {
    if (arg && CASES.some((c) => c.case_id === arg) && arg !== state.selected) { state.selected = arg; renderCase(); }
    renderCaseList();
  }
  if (arg || location.hash === "") return;
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
renderCase();
renderCaseList();
route();

/* ---------- live demo: capture replay + risk simulator ----------
   Loaded after console.js and uses its helpers (esc, num, btc, sev, ring, factorRows ...). */
const STREAM = DATA.stream || [];
const TH = DATA.model_card.thresholds;
const levelOf = (risk) => risk >= TH.critical ? "CRITICAL" : risk >= TH.high ? "HIGH" : risk >= TH.medium ? "MEDIUM" : "LOW";
const hms = (ts) => iso(ts).slice(11, 19);

const live = {
  i: 0, clock: STREAM.length ? STREAM[0].t : 0, playing: false, timer: null, seconds: 30,
  obs: 0, flagged: 0, resolved: 0, cases: new Map(), buckets: [],
};
const T0 = STREAM.length ? STREAM[0].t : 0, T1 = STREAM.length ? STREAM[STREAM.length - 1].t : 1;
const BINS = DATA.overview.timeline.length || 36, BIN_W = (T1 - T0) / BINS || 1;
const BIN_MAX = Math.max(1, ...DATA.overview.timeline.map((b) => b.total));

(function renderLiveShell() {
  $("panel-live").innerHTML = `
    <div class="card live-head">
      <div>
        <div class="eyebrow">Live demo</div>
        <h2 style="font-size:19px">Watch the system work through the capture</h2>
        <p class="desc" style="margin-bottom:0">Replays the recorded demo capture in arrival order, with the scores the pipeline gave each transaction. Transactions arrive, origins are attributed, and an alert opens the moment a laundering pattern is recognised.</p>
      </div>
      <div class="live-ctl">
        <button class="btn primary big" type="button" id="lv-play">▶ Run live demo</button>
        <button class="btn" type="button" id="lv-reset">↺ Reset</button>
        <div class="chips" role="group" aria-label="Replay speed">
          <button class="chip" type="button" data-sec="30" aria-pressed="true">Normal</button>
          <button class="chip" type="button" data-sec="10" aria-pressed="false">Fast</button>
        </div>
      </div>
    </div>
    <div class="live-bar"><div id="lv-progress"></div></div>
    <div class="live-stats">
      <div class="lstat"><span>Capture clock (UTC)</span><b id="lv-clock" class="mono">--:--:--</b></div>
      <div class="lstat"><span>Network observations</span><b id="lv-obs">0</b></div>
      <div class="lstat"><span>Transactions joined</span><b id="lv-tx">0</b></div>
      <div class="lstat"><span>Origins resolved</span><b id="lv-res">0</b></div>
      <div class="lstat"><span>Flagged</span><b id="lv-flag">0</b></div>
      <div class="lstat alert"><span>Alerts opened</span><b id="lv-cases">0</b></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2>Incoming transactions</h2><p class="desc">Newest first. Flagged transactions are marked with their severity.</p>
        <div class="feed" id="lv-feed"><div class="empty">Press “Run live demo” to start the replay.</div></div></div>
      <div class="card"><h2>Alerts</h2><p class="desc">One alert per operation. It grows as more of its transactions arrive; select it to open the case.</p>
        <div class="alerts" id="lv-alerts"><div class="empty">No alerts yet.</div></div></div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Activity so far</h2>
      <div class="legend" style="margin-top:8px"><span style="--c:var(--series-1)">flagged</span><span style="--c:var(--context)">not flagged</span></div>
      <div class="cols" id="lv-cols"></div>
      <div class="axis-x"><span>${STREAM.length ? clock(T0) : ""}</span><span>${STREAM.length ? clock(T1) : ""}</span></div></div>
    <div id="sim"></div>`;
})();

function liveReset() {
  clearInterval(live.timer);
  Object.assign(live, {i: 0, clock: T0, playing: false, timer: null, obs: 0, flagged: 0, resolved: 0,
    cases: new Map(), buckets: Array.from({length: BINS}, () => [0, 0])});
  $("lv-feed").innerHTML = `<div class="empty">Press “Run live demo” to start the replay.</div>`;
  $("lv-alerts").innerHTML = `<div class="empty">No alerts yet.</div>`;
  $("lv-play").textContent = "▶ Run live demo";
  livePaint(true);
}

function livePaint(full) {
  $("lv-clock").textContent = live.i ? hms(Math.min(live.clock, T1)) : "--:--:--";
  $("lv-obs").textContent = num(live.obs);
  $("lv-tx").textContent = num(live.i);
  $("lv-res").textContent = num(live.resolved);
  $("lv-flag").textContent = num(live.flagged);
  $("lv-cases").textContent = num(live.cases.size);
  $("lv-progress").style.width = (STREAM.length ? (live.i / STREAM.length) * 100 : 0) + "%";
  if (!full) return;
  $("lv-cols").innerHTML = live.buckets.map(([total, flagged]) => `<div class="col">` +
    (flagged ? `<div class="seg flag" style="height:${(flagged / BIN_MAX) * 100}%"></div>` : "") +
    (total - flagged ? `<div class="seg rest" style="height:${((total - flagged) / BIN_MAX) * 100}%"></div>` : "") + `</div>`).join("");
}

function liveAlerts() {
  const items = [...live.cases.values()].sort((a, b) => b.last - a.last);
  $("lv-alerts").innerHTML = items.map((a) => {
    const c = CASES.find((k) => k.case_id === a.id), level = levelOf(a.peak);
    return `<a class="alert-card${a.fresh ? " fresh" : ""}" href="#cases/${esc(a.id)}" style="--c:${SEV_VAR[level]}">
      <div class="row"><span>${sev(level)} &nbsp;<b>${esc(a.id)}</b></span><span class="mono small">opened ${hms(a.first)}</span></div>
      <div>${esc(c ? c.typology : "")}</div>
      <div class="meter" style="--c:${SEV_VAR[level]}"><div style="width:${c ? (a.n / c.tx_count) * 100 : 0}%"></div></div>
      <div class="row small"><span>${a.n} of ${c ? c.tx_count : a.n} transactions seen</span><span>peak risk <b>${num(a.peak, 1)}</b></span></div></a>`;
  }).join("");
  items.forEach((a) => { a.fresh = false; });
}

function liveTick() {
  live.clock += (T1 - T0) / (live.seconds * 20);
  const rows = [];
  let alertsChanged = false;
  while (live.i < STREAM.length && STREAM[live.i].t <= live.clock) {
    const x = STREAM[live.i++];
    live.obs += x.o;
    if (x.ip) live.resolved++;
    const bucket = live.buckets[Math.min(BINS - 1, Math.floor((x.t - T0) / BIN_W))];
    bucket[0]++;
    const flagged = x.r >= TH.medium;
    if (flagged) { live.flagged++; bucket[1]++; }
    if (x.c) {
      let a = live.cases.get(x.c);
      if (!a) { a = {id: x.c, first: x.t, n: 0, peak: 0, fresh: true}; live.cases.set(x.c, a); }
      a.n++; a.last = x.t; a.peak = Math.max(a.peak, x.r);
      alertsChanged = true;
    }
    rows.push(`<div class="feed-row${flagged ? " hot" : ""}"><span class="mono">${hms(x.t)}</span><span class="mono">${esc(x.id)}…</span>
      <span class="net">${esc(x.n)}</span><span class="n">${esc(btc(x.v))}</span><span>${flagged ? sev(levelOf(x.r)) : `<span class="small">clear</span>`}</span><span class="n"><b>${num(x.r, 1)}</b></span></div>`);
  }
  if (rows.length) {
    const feed = $("lv-feed");
    if (feed.querySelector(".empty")) feed.innerHTML = "";
    feed.insertAdjacentHTML("afterbegin", rows.reverse().join(""));
    while (feed.children.length > 40) feed.lastElementChild.remove();
  }
  if (alertsChanged) liveAlerts();
  livePaint(rows.length > 0);
  if (live.i >= STREAM.length) {
    clearInterval(live.timer);
    live.playing = false;
    $("lv-play").textContent = "✓ Replay finished — run again";
    toast(`Replay finished: ${live.cases.size} alerts from ${num(STREAM.length)} transactions`);
  }
}

$("lv-play").addEventListener("click", () => {
  if (live.playing) {
    clearInterval(live.timer);
    live.playing = false;
    $("lv-play").textContent = "▶ Resume";
    return;
  }
  if (live.i >= STREAM.length) liveReset();
  live.playing = true;
  $("lv-play").textContent = "⏸ Pause";
  live.timer = setInterval(liveTick, 50);
});
$("lv-reset").addEventListener("click", liveReset);
$("panel-live").querySelectorAll("[data-sec]").forEach((chip) => chip.addEventListener("click", () => {
  live.seconds = Number(chip.dataset.sec);
  $("panel-live").querySelectorAll("[data-sec]").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
}));
liveReset();

/* ---------- risk simulator: the fusion model evaluated in the browser ---------- */
(function simulator() {
  const EV = DATA.model_card.evidence, BIAS = DATA.model_card.bias, BASE = DATA.model_card.base_value_log_odds;
  const sim = {gnn: 0.9, anomaly: 0.5, net: "origin_tor", hops: 12, coinjoin: 0, delay: 1, burst: 3};
  const PRESETS = {
    "Ordinary payment": {gnn: 0.03, anomaly: 0.45, net: "", hops: 0, coinjoin: 0, delay: 60, burst: 0},
    "Peel chain via Tor": {gnn: 0.9, anomaly: 0.5, net: "origin_tor", hops: 12, coinjoin: 0, delay: 1, burst: 3},
    "Same chain, from an exchange": {gnn: 0.9, anomaly: 0.5, net: "origin_exchange", hops: 12, coinjoin: 0, delay: 1, burst: 3},
    "CoinJoin via VPN": {gnn: 0.85, anomaly: 0.65, net: "origin_vpn", hops: 0, coinjoin: 0.5, delay: 5, burst: 1},
  };
  const NETS = [["", "Residential / mobile"], ["origin_tor", "Tor exit"], ["origin_vpn", "Commercial VPN"], ["origin_hosting", "Datacentre"], ["origin_exchange", "Known exchange"]];
  const slider = (key, label, min, max, step, unit) => `<label class="ctl"><span>${esc(label)} <b id="sv-${key}"></b>${unit ? " " + esc(unit) : ""}</span>
    <input type="range" id="s-${key}" min="${min}" max="${max}" step="${step}"></label>`;

  $("sim").innerHTML = `<div class="card" style="margin-top:16px">
    <div class="eyebrow">Try it yourself</div><h2 style="font-size:19px">Risk simulator</h2>
    <p class="desc">This is the real risk-fusion model, computed in your browser from its trained weights. Change the evidence and watch the score and its explanation move.</p>
    <div class="chips" id="sim-presets" style="margin-bottom:14px">${Object.keys(PRESETS).map((p) => `<button class="chip" type="button" data-preset="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="sim-grid">
      <div class="sim-controls">
        ${slider("gnn", "GNN laundering probability", 0, 1, 0.01)}
        ${slider("anomaly", "Isolation Forest outlier score", 0, 1, 0.01)}
        <div class="ctl"><span>First-seen origin network</span><div class="chips" id="sim-net">${NETS.map(([k, l]) => `<button class="chip" type="button" data-net="${k}">${esc(l)}</button>`).join("")}</div></div>
        ${slider("hops", "Peeling chain length", 0, 16, 1, "hops")}
        ${slider("coinjoin", "Share of equal-valued outputs", 0, 1, 0.05)}
        ${slider("delay", "Funds re-spent after", 0, 60, 1, "min")}
        ${slider("burst", "Other transactions from the same IP within 10 min", 0, 15, 1)}
      </div>
      <div class="sim-out"><div class="sim-score" id="sim-score"></div><div id="sim-factors"></div><div class="equation" id="sim-eq"></div></div>
    </div></div>`;

  function values() {
    return {
      gnn_prob: sim.gnn, anomaly: sim.anomaly,
      origin_tor: +(sim.net === "origin_tor"), origin_vpn: +(sim.net === "origin_vpn"),
      origin_hosting: +(sim.net === "origin_hosting"), origin_exchange: +(sim.net === "origin_exchange"),
      peel_chain: sim.hops >= TH.peel_min_hops ? Math.min(1, Math.log2(1 + sim.hops) / 4) : 0,
      coinjoin: sim.coinjoin, velocity: Math.exp(-(sim.delay * 60) / 300),
      origin_burst: Math.min(1, Math.log2(1 + sim.burst) / 4),
    };
  }
  function paint() {
    ["gnn", "anomaly", "hops", "coinjoin", "delay", "burst"].forEach((k) => {
      $("s-" + k).value = sim[k];
      $("sv-" + k).textContent = Number.isInteger(sim[k]) ? sim[k] : sim[k].toFixed(2);
    });
    $("sim-net").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.net === sim.net)));
    const x = values();
    let logit = BIAS;
    const factors = EV.map((e) => {
      const v = x[e.key] || 0, phi = e.weight * (v - e.background);
      logit += e.weight * v;
      return {factor: e.absent_label && v < 0.5 ? e.absent_label : e.label, value: v.toFixed(2), shap_log_odds: phi, share_pct: ""};
    }).sort((a, b) => Math.abs(b.shap_log_odds) - Math.abs(a.shap_log_odds));
    const risk = 100 / (1 + Math.exp(-logit)), level = levelOf(risk);
    $("sim-score").innerHTML = `${ring(risk, level)}<div><div>${sev(level)}</div>
      <div class="small" style="margin-top:4px">${level === "LOW" ? "Below the reporting threshold: not flagged." : "Would be flagged and grouped into a case."}</div></div>`;
    $("sim-factors").innerHTML = factorRows(factors);
    $("sim-eq").innerHTML = `<span>Base value <b>${signed(BASE)}</b></span><span>+ contributions <b>${signed(logit - BASE)}</b></span><span>= log-odds <b>${signed(logit)}</b></span><span>→ risk <b>${num(risk, 1)}</b></span>`;
  }
  ["gnn", "anomaly", "hops", "coinjoin", "delay", "burst"].forEach((k) => $("s-" + k).addEventListener("input", (ev) => {
    sim[k] = Number(ev.target.value);
    $("sim-presets").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    paint();
  }));
  $("sim-net").querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    sim.net = c.dataset.net;
    $("sim-presets").querySelectorAll(".chip").forEach((p) => p.setAttribute("aria-pressed", "false"));
    paint();
  }));
  $("sim-presets").querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
    Object.assign(sim, PRESETS[c.dataset.preset]);
    $("sim-presets").querySelectorAll(".chip").forEach((p) => p.setAttribute("aria-pressed", String(p === c)));
    paint();
  }));
  $("sim-presets").querySelector('[data-preset="Peel chain via Tor"]').setAttribute("aria-pressed", "true");
  paint();
})();

/* ?autoplay starts the replay on load, for unattended screens */
if (new URLSearchParams(location.search).has("autoplay")) { location.hash = "#live"; $("lv-play").click(); }

</script>
